<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>箱縛り｜番線｜結び方 3D</title>
<style>
:root{--surface-0:#ffffff;--surface-1:#f3f2ee;--surface-2:#e9e7e0;--text-primary:#1f1e1c;--border-strong:#b4b2a9;--border-stronger:#5f5e5a;--radius:8px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--surface-0:#2c2c2a;--surface-1:#1f1e1c;--surface-2:#3a3936;--text-primary:#f1efe8;--border-strong:#5f5e5a;--border-stronger:#b4b2a9}}
body{margin:0;padding:12px;background:var(--surface-0);color:var(--text-primary);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:720px;margin:0 auto}
.vb{font-size:13px;padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.vb.on{background:var(--surface-0);border-color:var(--border-stronger)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#cap{margin-top:8px;font-size:14px;line-height:1.6;min-height:4.8em}
#cap .src{font-size:12px;opacity:0.7}
.key{font-size:12px;margin-top:6px;opacity:0.8}
.key b{display:inline-block;width:10px;height:10px;border-radius:5px;margin:0 4px 0 10px;vertical-align:middle}
.key b:first-child{margin-left:0}
.back{display:inline-block;font-size:13px;color:inherit;opacity:0.7;margin-bottom:4px}
h1{font-size:20px;margin:0}
.sub{font-size:13px;opacity:0.7;margin:2px 0 10px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../">← 結び方の一覧</a>
<h1>箱縛り</h1>
<p class="sub">単管に載せた足場板／番線を奥の単管の下にくぐらせ、板の上を2本で渡し、手前の角で輪を作って手前の単管の下から引き上げ、シノで締める</p>
<div id="c" style="position:relative;width:100%;height:440px;touch-action:none;border-radius:12px;background:var(--surface-1);overflow:hidden;cursor:grab"></div>
<div class="key"><b style="background:#BA7517"></b>奥でくぐらせて板の上を渡る部分<b style="background:#2F7FB5"></b>手前の端（輪・ねじれ・余り）<b style="background:#E24B4A"></b>切り口<b style="background:#7F77DD"></b>シノを回す向き</div>
<div id="cap"></div>
<div class="row">
<button class="vb" data-s="0">番線</button>
<button class="vb" data-s="1">1</button>
<button class="vb" data-s="2">2</button>
<button class="vb" data-s="3">3</button>
<button class="vb" data-s="4">4</button>
<button class="vb" data-s="5">5</button>
<button class="vb on" data-s="6">6</button>
<button class="vb" data-s="7">7</button>
<button id="nx" class="vb">次へ</button>
</div>
<div class="row">
<button id="hp" class="vb">板と単管を隠す</button>
<button id="zi" class="vb">拡大 ＋</button>
<button id="zo" class="vb">縮小 －</button>
<button id="fs" class="vb">寄る</button>
<button id="fa" class="vb">全体</button>
</div>
<div class="row">
<button class="vb" data-t="57" data-p="0.5">斜めから</button>
<button class="vb" data-t="90" data-p="0.15">結び目の正面から</button>
<button class="vb" data-t="0" data-p="0.1">横から</button>
<button class="vb" data-t="0" data-p="1.4">上から</button>
<button class="vb" data-t="-90" data-p="0.2">奥の端から</button>
<button id="ar" class="vb">自動回転 切</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const c=document.getElementById('c');
const W0=c.clientWidth||340,H0=440;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(W0,H0);
c.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,W0/H0,0.05,100);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
const dl=new THREE.DirectionalLight(0xffffff,0.8);
dl.position.set(6,8,5);
scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.35);
dl2.position.set(-5,-3,-4);
scene.add(dl2);
const V=THREE.Vector3;
// 単管（直径48.6mm）を半径 r=0.5 とする縮尺。単管は x 方向。足場板（幅240mm、厚さ約35mm）はその上に、長さを z 方向にして載る。
// 番線を締める人は、板の手前の端（+x 側）に立つ。
const r=0.5,PL=14;
const W=4.9,T=0.7,LEN=12;
const solids=new THREE.Group();
const pipe=new THREE.Mesh(new THREE.CylinderGeometry(r,r,PL,32),new THREE.MeshStandardMaterial({color:0xb9bdc3,roughness:0.5,metalness:0.2}));
pipe.rotation.z=Math.PI/2;
solids.add(pipe);
// 板は、オレンジの番線と見分けやすい淡い色にする。
const board=new THREE.Mesh(new THREE.BoxGeometry(W,T,LEN),new THREE.MeshStandardMaterial({color:0xE2DACB,roughness:0.85,metalness:0}));
board.position.y=r+T/2;
solids.add(board);
scene.add(solids);
const wm=new THREE.MeshStandardMaterial({color:0xBA7517,roughness:0.5,metalness:0.3});
const fm=new THREE.MeshStandardMaterial({color:0x2F7FB5,roughness:0.5,metalness:0.3});
const sm=new THREE.MeshStandardMaterial({color:0x6b6a65,roughness:0.35,metalness:0.7});
const em=new THREE.MeshStandardMaterial({color:0xE24B4A,roughness:0.4});
const am=new THREE.MeshStandardMaterial({color:0x7F77DD,roughness:0.5});
const dyn=new THREE.Group();
scene.add(dyn);
const WR=0.035;
// 確認用: 描いた線とシノの点をすべて記録しておく（板・単管へのめり込みを調べるため）。
window._pts=[];window._curves=[];window._shino=[];
function tube(pts,mat){
const cv=new THREE.CatmullRomCurve3(pts,false,'centripetal');
window._pts.push.apply(window._pts,cv.getSpacedPoints(400));
window._curves.push(cv);
return new THREE.Mesh(new THREE.TubeGeometry(cv,Math.max(200,pts.length*12),WR,10,false),mat);
}
function endDot(p){
const m=new THREE.Mesh(new THREE.SphereGeometry(0.06,14,14),em);
m.position.copy(p);
return m;
}
// 番線の通り道（動画「【番線#03】足場板のはこ縛り」と「【番線縛り】足場板の固定方法！ハコ縛り！」で確かめた順）。
// 奥の端（-x 側）で単管の下をU字にくぐらせ、両端をそろえて板の奥の角で折り、板の上面を2本（P：z=+s、Q：z=-s）で手前へ渡す。
// 手前の端（+x 側）で Q が輪を作り、Q の先を単管の下にくぐらせて引き上げる。輪にシノを差して、上から見て時計回りに回す。
// ねじれるのは、板の手前の角から単管までの縦の部分。
const e=WR+0.008,s=0.07,rw=r+e,yTop=r+T;
const phi0=Math.asin(s/rw);
// 奥の端の外で、単管の下をくぐるU字（z=+s の側から下を通って z=-s の側へ）。
function farU(){
const a=[];
for(let i=0;i<=36;i++){const f=phi0+(2*Math.PI-2*phi0)*i/36;a.push(new V(-W/2-e,rw*Math.cos(f),rw*Math.sin(f)));}
return a;
}
function line(a,p0,p1,n){for(let i=1;i<=n;i++)a.push(p0.clone().lerp(p1,i/n));}
function cornerArc(a,cx,a0,a1,z){for(let i=1;i<=6;i++){const g=(a0+(a1-a0)*i/6)*Math.PI/180;a.push(new V(cx+e*Math.cos(g),yTop+e*Math.sin(g),z));}}
// 奥の端から板の上面を手前の角まで。dir=+1 は P（z=+s）を手前へ、Q は逆にたどる。
function overTop(zz){
// 奥の端の面を上がり、奥の角を回って、上面を手前の角まで。
const a=[new V(-W/2-e,rw*Math.cos(phi0)+0.02,zz)];
line(a,a[0].clone(),new V(-W/2-e,yTop,zz),5);
cornerArc(a,-W/2,180,90,zz);
line(a,new V(-W/2,yTop+e,zz),new V(W/2,yTop+e,zz),24);
return a;
}
// 手前の結び目。ねじれの軸は、板の手前の面のすぐ外を縦に通る（x=XA, z=0）。
const XA=W/2+e+0.08,HR=0.075,YT=yTop+0.08,YB=r+0.22;
// 3本の角度（上から見て +x から +z へ測る）。P は板の面の側、Qd（輪から下りる）は +z の側、Qu（単管の下から上がる）は -z の側。120度ずつ離す。
const AP=Math.PI,AQD=Math.PI/3,AQU=-Math.PI/3;
function hx(al,y){return new V(XA+HR*Math.cos(al),y,HR*Math.sin(al));}
// ねじれ。下（単管の側）を固定し、上へ行くほど turns 回転だけ時計回りに回る。turns は整数にして、上と下のつなぎ目の形を毎回同じにする。
function helix(al,turns,downward){
const a=[];
for(let i=0;i<=40;i++){const t=i/40;const y=YB+(YT-YB)*t;a.push(hx(al+2*Math.PI*turns*t,y));}
return downward?a.reverse():a;
}
// 手前の端の外で、単管の下をくぐるU字（Qd の下の端 z=+HR から、下を通って Qu の下の端 z=-HR へ）。
const XU=XA+HR*Math.cos(AQD),ZU=HR*Math.sin(AQD),phiN=Math.asin(ZU/rw);
function nearU(){
const a=[];
for(let i=0;i<=36;i++){const f=phiN+(2*Math.PI-2*phiN)*i/36;a.push(new V(XU,rw*Math.cos(f),rw*Math.sin(f)));}
return a;
}
// 輪。手前の角の上に立つ縦の輪で、シノはこれを x の向きに通る。入口と出口は輪の下で交差し、x の向きに少しずらす。
const RC=new V(XA,YT+0.35,0),RR=0.13;
function ring(){
const a=[];
for(let i=0;i<=28;i++){const g=-Math.PI/2+2*Math.PI*i/28;a.push(new V(XA-0.06+0.12*i/28,RC.y+RR*Math.sin(g),RR*Math.cos(g)));}
return a;
}
// P：手前の角を回って、板の面に沿ってねじれの上の端へ。
function pDown(){
const a=[];
a.push(new V(W/2+0.02,yTop+e+0.012,s*0.8),hx(AP,YT));
return a;
}
// Q：手前の角から輪の入口へ上がる。
function qUp(){
// 手前の角から、ねじれの上を越えて輪へ（ねじれた番線に触れないよう、角のすぐ上で持ち上げる）。
return [new V(W/2+0.012,YT+0.12,-0.13),new V(XA-0.07,RC.y-RR-0.02,-0.04)];
}
function shino(tip,dir){
const g=new THREE.Group();
const rod=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.03,4.5,24),sm);
rod.position.y=2.25;
g.add(rod);
const head=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.11,10,28),sm);
head.position.y=4.5+0.38;
g.add(head);
g.quaternion.setFromUnitVectors(new V(0,1,0),dir);
g.position.copy(tip);
for(let i=0;i<=40;i++)window._shino.push(tip.clone().addScaledVector(dir,4.5*i/40));
return g;
}
// 上から見て時計回りの矢印（輪の上、水平な面）。
function arrow(){
const pts=[];
const R=0.9,cy=RC.y+0.45;
for(let i=0;i<=40;i++){const g=Math.PI*0.75+Math.PI*1.2*i/40;pts.push(new V(XA+R*Math.cos(g),cy,R*Math.sin(g)));}
dyn.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,0.035,8,false),am));
const cone=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.3,14),am);
cone.position.copy(pts[pts.length-1]);
cone.quaternion.setFromUnitVectors(new V(0,1,0),pts[pts.length-1].clone().sub(pts[pts.length-2]).normalize());
dyn.add(cone);
}
// 段階: 0=番線だけ 1=奥の単管の下にくぐらせ両端をそろえる 2=奥の角で折り、板の上を手前へ渡す 3=手前の角で輪を作る
// 4=輪を作った方を手前の単管の下にくぐらせて引き上げる 5=輪にシノを差して時計回りに回す 6=締まった形 7=余りを切る
const ST=[null,null,null,{},{u:true},{u:true,turns:1,shino:true},{u:true,turns:2},{u:true,turns:2,cut:true}];
const CAP=[
['番線（1本もの）。','根拠：「【番線#03】足場板のはこ縛り」（https://www.youtube.com/watch?v=F-DlXcBLJjA）0:06〜0:10 の字幕「この際、先端は揃えましょう」（1本の番線の両端をそろえて使う）'],
['奥の端の外で、番線を下の単管の下にくぐらせて通し、両端をそろえて上へ引き上げる。単管には巻き付けず、くぐらせるだけ。','根拠：「【番線#03】足場板のはこ縛り」0:06〜0:10 の字幕「まず下の単管に番線をくぐらせて通します。この際、先端は揃えましょう」、「【番線縛り】足場板の固定方法！ハコ縛り！」（https://www.youtube.com/watch?v=-29ykrgZAuM）0:51〜0:58「単管の下から通します」。巻き付けずにくぐらせるだけなのは、後者 0:51〜0:58 の映像で確認'],
['2本をそろえたまま足場板の角で折り曲げ、板の上を手前の端まで渡す。2本は単管と同じ向きに並んで、板をまたぐ。','根拠：「【番線#03】」0:11〜0:19 の字幕「足場板の角で折り曲げます」、「ハコ縛り！」0:55〜0:58「キュッと絞って、こっちに折り曲げます」。板の上を2本が渡る形は「【番線#03】」0:42 の映像で確認'],
['手前の角で、片方の番線で輪を作る。輪を作るときの交差の向きが大事で、時計回りに回すなら尻手（番線の端）を奥にする。','根拠：「【番線#03】」0:21〜0:33 の字幕「反対の角で輪をつくります」「輪を作る交差がポイント！時計回りの場合は尻手を奥にします」、「ハコ縛り！」1:02〜1:12（輪っかを作る場面）。どちらの番線で輪を作るか、輪の大きさ・向きは、映像から確定できなかった（図は一例）'],
['輪を作った方の番線の先を、手前の単管の下にくぐらせて引き上げる。','根拠：「【番線#03】」0:37〜0:42 の字幕「下の単管をくぐらせて引き上げます」、「ハコ縛り！」1:17〜1:30「輪っかを作った方です。これを、この単管の下から、こう持ってくる」。引き上げた先を輪とどう組むか（「ハコ縛り！」1:35〜1:40 で「十字に」と言っている所）は、映像から確定できなかった'],
['輪にシノを差し、シノを板の上に寝かせて、上から見て時計回りに回す。板の手前の角から単管までの縦の部分がねじれていく。','根拠：「【番線#03】」0:45〜0:56 の字幕「しのを挿して時計回りに回します」（シノが板の上に寝て回る様子を映像で確認）、0:51〜1:00 の字幕「輪の交差が逆だと反時計回りに回さなければならずやりづらい。※左利きの場合はやりやすい」。ねじれに入る番線の本数と並びは、映像から確定できなかった（図は3本にしている）'],
['締まると、板の手前の角から単管まで、番線がねじれて縄のようになる。足場板は動かなくなる。','根拠：「ハコ縛り！」2:25 の「この足場板、全く動かなくなってる」、「【番線#03】」1:00 の映像。回す回数は資料に数値なし（図は2回転）'],
['余りを短く切る。作業する人に当たると危ないので、切った先は倒しておく。','根拠：「ハコ縛り！」2:38〜2:52（ニッパーで切る場面、「この作業者の人が当たったら危ないんで」）。倒す向きは映像から確定できなかったので、図では倒していない']
];
function setCap(t,sr){document.getElementById('cap').innerHTML=t+'<div class="src">'+sr+'</div>';}
let step=6,hideSolid=false;
function clear(){window._pts=[];window._curves=[];window._shino=[];while(dyn.children.length){const o=dyn.children[0];o.traverse(function(m){if(m.geometry)m.geometry.dispose();});dyn.remove(o);}}
function build(){
clear();
if(step===0){
const L=13,X=1.2,Y=yTop+2;
const a=[];
for(let i=0;i<=30;i++)a.push(new V(-L/2-X+(L+2*X)*i/30,Y,2.5));
dyn.add(tube(a,wm));
dyn.add(endDot(a[0]));dyn.add(endDot(a[a.length-1]));
return;
}
if(step===1){
// 奥の単管の下をくぐらせ、両端をそろえて上へ。
const top=yTop+1.3,U=farU();
const a=[new V(-W/2-e,top,s)];
line(a,a[0].clone(),U[0].clone().add(new V(0,0.02,0)),8);
const b=a.concat(U.slice(1,-1));
line(b,U[U.length-1].clone().add(new V(0,0.02,0)),new V(-W/2-e,top,-s),8);
dyn.add(tube(b,wm));
dyn.add(endDot(b[0]));dyn.add(endDot(b[b.length-1]));
return;
}
const pTop=overTop(s),qTop=overTop(-s);
const main=pTop.slice().reverse().concat(farU().slice(1,-1)).concat(qTop);
dyn.add(tube(main,wm));
const cP=pTop[pTop.length-1],cQ=qTop[qTop.length-1];
let A,B;
if(step===2){
// 両端は手前の端から外へ伸ばしておく。
A=[cP];line(A,cP.clone(),new V(W/2+1.0,yTop+e,s),5);
B=[cQ];line(B,cQ.clone(),new V(W/2+1.0,yTop+e,-s),5);
}else{
const q=ST[step];
const turns=q.turns||0;
// P：角を回って板の面に沿って下り、ねじれに入る。端はねじれの下で止まる。
A=[cP].concat(pDown()).concat(helix(AP,turns,true).slice(1));
A.push(hx(AP,YB-0.07));
// Q：角から輪へ上がり、輪を回って、ねじれの上へ下りる。
const rg=ring();
B=[cQ].concat(qUp()).concat(rg);
const ex=rg[rg.length-1];
B.push(new V(XA+0.06,RC.y-RR-0.08,0.03));
if(!q.u){
// 3：Q の先はまだ単管をくぐらせていない。手前へ垂らしておく。
B.push(hx(AQD,YT+0.02));
B.push(new V(XA+0.25,YT-0.15,HR+0.1),new V(XA+0.7,YT-0.3,HR+0.25),new V(XA+1.1,YT-0.4,HR+0.35));
}else{
B.push(hx(AQD,YT+0.02));
B=B.concat(helix(AQD,turns,true).slice(1));
const U=nearU();
B.push(U[0].clone().add(new V(0,0.05,0)));
B=B.concat(U.slice(1,-1));
B.push(U[U.length-1].clone().add(new V(0,0.05,0)));
B=B.concat(helix(AQU,turns,false));
if(q.cut)B.push(new V(XA+0.04,YT+0.09,-HR-0.02));
else B.push(new V(XA+0.08,YT+0.14,-HR-0.03),new V(XA+0.4,YT+0.35,-0.16),new V(XA+0.85,YT+0.5,-0.22));
}
if(q.shino){
const dir=new V(-1,0.12,0).normalize();
dyn.add(shino(RC.clone().addScaledVector(dir,-0.35),dir));
arrow();
}
}
dyn.add(tube(A,fm));dyn.add(tube(B,fm));
dyn.add(endDot(A[A.length-1]));dyn.add(endDot(B[B.length-1]));
}
const tgt=new V(),tgtG=new V();
let th=1.0,ph=0.5,rad=6,radG=6,goT=null,goP=null,auto=false,drag=false,lx=0,ly=0;
function focusAll(){tgtG.set(0,r,0);radG=14;}
function focusShino(){if(step===0){tgtG.set(0,yTop+1.6,2.5);radG=14;}else if(step<=2){tgtG.set(0,r,0);radG=12;}else{tgtG.set(XA,0.95,0);radG=step===5?7:4;}}
function setStep(sn,keep){
step=Math.max(0,Math.min(7,sn));
setCap(CAP[step][0],CAP[step][1]);
build();
if(!keep){focusShino();}
document.querySelectorAll('.vb[data-s]').forEach(function(b){b.classList.toggle('on',parseInt(b.dataset.s)===step);});
}
function place(){
tgt.lerp(tgtG,0.15);
rad+=(radG-rad)*0.15;
cam.position.set(tgt.x+rad*Math.cos(ph)*Math.sin(th),tgt.y+rad*Math.sin(ph),tgt.z+rad*Math.cos(ph)*Math.cos(th));
cam.lookAt(tgt);
}
function zoom(f){radG=Math.max(1.2,Math.min(30,radG*f));}
const ptrs=new Map();
let pd=0;
c.addEventListener('pointerdown',function(ev){
ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
c.setPointerCapture(ev.pointerId);
goT=null;goP=null;
if(ptrs.size===1){drag=true;lx=ev.clientX;ly=ev.clientY;c.style.cursor='grabbing';}
if(ptrs.size===2){drag=false;const a=Array.from(ptrs.values());pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
function up2(ev){
ptrs.delete(ev.pointerId);
if(ptrs.size===0){drag=false;c.style.cursor='grab';}
if(ptrs.size===1){const a=Array.from(ptrs.values())[0];lx=a.x;ly=a.y;drag=true;}
}
c.addEventListener('pointerup',up2);
c.addEventListener('pointercancel',up2);
c.addEventListener('pointermove',function(ev){
if(ptrs.has(ev.pointerId))ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
if(ptrs.size===2){
const a=Array.from(ptrs.values());
const dd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
if(pd>0&&dd>0){zoom(pd/dd);}
pd=dd;
return;
}
if(!drag)return;
th-=(ev.clientX-lx)*0.012;
ph=Math.max(-1.5,Math.min(1.5,ph+(ev.clientY-ly)*0.012));
lx=ev.clientX;ly=ev.clientY;
});
c.addEventListener('wheel',function(ev){ev.preventDefault();zoom(ev.deltaY>0?1.12:0.89);},{passive:false});
document.querySelectorAll('.vb[data-s]').forEach(function(b){
b.addEventListener('click',function(){setStep(parseInt(b.dataset.s),false);});
});
document.getElementById('nx').addEventListener('click',function(){setStep(step>=7?0:step+1,false);});
document.getElementById('zi').addEventListener('click',function(){zoom(0.7);});
document.getElementById('zo').addEventListener('click',function(){zoom(1.4);});
document.getElementById('fs').addEventListener('click',focusShino);
document.getElementById('fa').addEventListener('click',focusAll);
document.getElementById('hp').addEventListener('click',function(){
hideSolid=!hideSolid;
this.textContent=hideSolid?'板と単管を出す':'板と単管を隠す';
solids.visible=!hideSolid;
});
document.querySelectorAll('.vb[data-t]').forEach(function(b){
b.addEventListener('click',function(){
goT=parseFloat(b.dataset.t)*Math.PI/180;
goP=parseFloat(b.dataset.p);
auto=false;
document.getElementById('ar').textContent='自動回転 切';
});
});
document.getElementById('ar').addEventListener('click',function(){
auto=!auto;goT=null;goP=null;
this.textContent=auto?'自動回転 入':'自動回転 切';
});
// 画面の幅が変わったら（携帯の向きを変えたときなど）、描く大きさを合わせ直す。
window.addEventListener('resize',function(){const w=c.clientWidth||340;renderer.setSize(w,H0);cam.aspect=w/H0;cam.updateProjectionMatrix();});
function wrapA(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function loop(){
requestAnimationFrame(loop);
if(auto&&!drag)th+=0.01;
if(goT!==null){
const dd=wrapA(goT-th);
th+=dd*0.15;
ph+=(goP-ph)*0.15;
if(Math.abs(dd)<0.005&&Math.abs(goP-ph)<0.005){th=goT;ph=goP;goT=null;goP=null;}
}
place();
renderer.render(scene,cam);
}
window._setStep=setStep;
setStep(6,false);
tgt.copy(tgtG);rad=radG;
loop();
</script>
</body>
</html>
