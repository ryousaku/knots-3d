<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南京結び｜ロープ｜結び方 3D</title>
<style>
:root{--surface-0:#ffffff;--surface-1:#f3f2ee;--surface-2:#e9e7e0;--text-primary:#1f1e1c;--border-strong:#b4b2a9;--border-stronger:#5f5e5a;--radius:8px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--surface-0:#2c2c2a;--surface-1:#1f1e1c;--surface-2:#3a3936;--text-primary:#f1efe8;--border-strong:#5f5e5a;--border-stronger:#b4b2a9}}
body{margin:0;padding:12px;background:var(--surface-0);color:var(--text-primary);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:720px;margin:0 auto}
.vb{font-size:13px;padding:6px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);cursor:pointer}
.vb.on{background:var(--surface-0);border-color:var(--border-stronger)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#cap{margin-top:8px;font-size:14px;line-height:1.6;min-height:4.8em}
#cap .src{font-size:12px;opacity:0.7}
.key{font-size:12px;margin-top:6px;opacity:0.8}
.key b{display:inline-block;width:10px;height:10px;border-radius:5px;margin:0 4px 0 10px;vertical-align:middle}
.key b:first-child{margin-left:0}
.back{display:inline-block;font-size:13px;color:inherit;opacity:0.7;margin-bottom:4px}
h1{font-size:20px;margin:0}
.sub{font-size:13px;opacity:0.7;margin:2px 0 10px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../">← 結び方の一覧</a>
<h1>南京結び</h1>
<p class="sub">トラックの荷台／8の字を作って2回巻き付け、端の側を通した長い輪をフックに掛けて引き締める（モノタロウの手順）</p>
<div id="c" style="position:relative;width:100%;height:440px;touch-action:none;border-radius:12px;background:var(--surface-1);overflow:hidden;cursor:grab"></div>
<div class="key"><b style="background:#BA7517"></b>荷物の側<b style="background:#2F7FB5"></b>端の側<b style="background:#E24B4A"></b>ロープの端<b style="background:#7F77DD"></b>引く向き</div>
<div id="cap"></div>
<div class="row">
<button class="vb" data-s="0">ロープ</button>
<button class="vb" data-s="1">1</button>
<button class="vb" data-s="2">2</button>
<button class="vb" data-s="3">3</button>
<button class="vb" data-s="4">4</button>
<button class="vb" data-s="5">5</button>
<button class="vb on" data-s="6">6</button>
<button class="vb" data-s="7">7</button>
<button id="nx" class="vb">次へ</button>
</div>
<div class="row">
<button id="hp" class="vb">荷台を隠す</button>
<button id="zi" class="vb">拡大 ＋</button>
<button id="zo" class="vb">縮小 －</button>
<button id="fs" class="vb">結び目に寄る</button>
<button id="fa" class="vb">全体</button>
</div>
<div class="row">
<button class="vb" data-t="0" data-p="0.05">正面から</button>
<button class="vb" data-t="70" data-p="0.1">横から</button>
<button class="vb" data-t="25" data-p="1.2">上から</button>
<button class="vb" data-t="-30" data-p="-0.6">下から</button>
<button id="ar" class="vb">自動回転 切</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const c=document.getElementById('c');
const W=c.clientWidth||340,H=440;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(W,H);
c.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,W/H,0.05,100);
scene.add(new THREE.AmbientLight(0xffffff,0.75));
const dl=new THREE.DirectionalLight(0xffffff,0.8);
dl.position.set(4,8,6);
scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.35);
dl2.position.set(-5,-3,-4);
scene.add(dl2);
const V=THREE.Vector3;
const root=new THREE.Group();
scene.add(root);
// 荷台: 奥にアオリ（縦の板）、その上に荷物、アオリの下のほうにロープを掛けるフック。ロープは荷物の上から手前に下りてくる。
const RR=0.09;
const PZ0=-1.25,PZ1=-1.05,PY0=-5.6,PY1=2.6;
const BOX={x0:-2,x1:2,y0:PY1,y1:5,z0:-3.5,z1:PZ1};
const HX=0.66,HY=-4.6,HR=0.07,HZ1=0.1;
const truck=new THREE.Group();
const panel=new THREE.Mesh(new THREE.BoxGeometry(6,PY1-PY0,PZ1-PZ0),new THREE.MeshStandardMaterial({color:0x9aa3ad,roughness:0.6,metalness:0.3}));
panel.position.set(0,(PY0+PY1)/2,(PZ0+PZ1)/2);
truck.add(panel);
const box=new THREE.Mesh(new THREE.BoxGeometry(BOX.x1-BOX.x0,BOX.y1-BOX.y0,BOX.z1-BOX.z0),new THREE.MeshStandardMaterial({color:0xc9a77a,roughness:0.8}));
box.position.set((BOX.x0+BOX.x1)/2,(BOX.y0+BOX.y1)/2,(BOX.z0+BOX.z1)/2);
truck.add(box);
// フック: アオリから手前に出る軸と、先が上に反り返った部分。
const hookPts=[];
for(let i=0;i<=8;i++)hookPts.push(new V(HX,HY,PZ1+(HZ1-PZ1)*i/8));
for(let i=1;i<=8;i++){const a=i/8*Math.PI/2;hookPts.push(new V(HX,HY+0.25*(1-Math.cos(a)),HZ1+0.25*Math.sin(a)));}
for(let i=1;i<=3;i++)hookPts.push(new V(HX,HY+0.25+0.08*i,HZ1+0.25));
const hm=new THREE.MeshStandardMaterial({color:0x55595f,roughness:0.35,metalness:0.7});
truck.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hookPts),80,HR,12,false),hm));
const plate=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.4,0.04),hm);
plate.position.set(HX,HY,PZ1+0.02);
truck.add(plate);
root.add(truck);
window._hook=hookPts;
const om=new THREE.MeshStandardMaterial({color:0xBA7517,roughness:0.7});
const bm=new THREE.MeshStandardMaterial({color:0x2F7FB5,roughness:0.7});
const em=new THREE.MeshStandardMaterial({color:0xE24B4A,roughness:0.4});
const am=new THREE.MeshStandardMaterial({color:0x7F77DD,roughness:0.5});
const dyn=new THREE.Group();
root.add(dyn);
function tube(pts,mat){
const cv=new THREE.CatmullRomCurve3(pts,false,'centripetal');
window._curves.push(cv);
return new THREE.Mesh(new THREE.TubeGeometry(cv,Math.max(200,pts.length*10),RR,12,false),mat);
}
function endDot(p){
const m=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,14),em);
m.position.copy(p);
return m;
}
function arrowDown(x,y0,y1,z){
const m=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,y0-y1,10),am);
m.position.set(x,(y0+y1)/2,z);
dyn.add(m);
const cone=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.3,14),am);
cone.position.set(x,y1-0.15,z);
cone.rotation.x=Math.PI;
dyn.add(cone);
}
const P=function(x,y,z){return new V(x,y,z||0);};
// 荷物の上から手前の角を回って、荷物の前を下り、アオリの上端から結び目へ。
const SX=-0.25;
function topPart(){
const a=[P(SX,BOX.y1+RR,-2.6),P(SX,BOX.y1+RR,-1.6)];
for(let i=0;i<=4;i++){const t=i/4*Math.PI/2;a.push(P(SX,BOX.y1+(RR+0.01)*Math.cos(t),BOX.z1+(RR+0.01)*Math.sin(t)));}
a.push(P(SX,3.6,BOX.z1+0.12),P(SX,PY1,PZ1+0.17),P(SX,1.5,-0.45),P(SX,0.85,-0.08));
return a;
}
// 結び目の形（写真の向き）: 端の側の二つ折り（耳）が左へ突き出し、その付け根に、荷物の側のロープが巻き付いている。
// 巻き付いたロープは下へ抜けて下の輪になり、下の輪の右側が上がって耳の下側の線になる。耳の上側の線が右へ出て、端の側になる。
// 巻き付きは、耳の2本（上下に並ぶ）を軸にしたらせん。最初の「8の字」は半周（耳の後ろを通るだけ）、1回巻くごとに1周増える。
const CR=0.33,CP=0.24,CX=SX,EY=0.11;
function coil(turns){
const a=[];
const n=Math.round(turns*16);
for(let i=0;i<=n;i++){const f=turns*2*Math.PI*i/n;a.push(P(CX+CP*turns*i/n,CR*Math.cos(f),-CR*Math.sin(f)));}
return a;
}
function lowerLoop(x0){
return [P(x0+0.03,-0.42,0.07),P(x0,-0.66,0.03),P(Math.min(x0,0.2)-0.02,-1.02),P(0.25,-1.45),P(0.6,-1.68),P(0.95,-1.45),P(1.05,-1.0),P(0.98,-0.55),P(0.82,-0.24),P(0.6,-EY)];
}
function ear(){
const a=[];
for(let x=0.3;x>-1.3;x-=0.3)a.push(P(x,-EY));
for(let i=0;i<=8;i++){const t=-Math.PI/2-i/8*Math.PI;a.push(P(-1.3+EY*Math.cos(t),EY*Math.sin(t)));}
for(let x=-1.0;x<0.65;x+=0.3)a.push(P(x,EY));
return a;
}
// 下の輪のまわりは、写真で輪が開いて見えるように、少しふくらませて描いている。
function knot(turns){
const cl=coil(turns);
const x0=cl[cl.length-1].x;
return {A:topPart().concat(cl).concat(lowerLoop(x0)).concat(ear()),T0:[P(0.85,0.13),P(1.15,0.02),P(1.38,-0.3)]};
}
// 段階: 0=ロープを下ろす 1=8の字 2=1回巻く 3=2回巻く 4=端の側を下の輪に通す 5=フックに掛ける 6=引いて締める 7=フックに巻いて留める
const CAP=[
['荷物の上を通したロープを、荷台の手前に下ろす。反対側の端は、向こう側のフックに留めてある。','根拠：モノタロウ、polalop'],
['左手で持ったロープ（荷物の側）に、その下を二つ折りにした輪を重ねて、数字の「8」の形を作る。上が二つ折りの輪（左へ突き出す）、下が下側の輪。','根拠：モノタロウ「左手で持ったロープの軸に、右手で二つ折りにした輪を重ねて数字の8」、polalop の写真'],
['下側の輪を、8の交わっている所（二つ折りの輪の付け根）に1回引っ掛ける。','根拠：モノタロウ、polalop の写真。巻く向き（手前から回すか奥から回すか）は写真から読み取れなかったので、図の向きは推測'],
['もう1回引っ掛ける。2回目は1回目より下（荷台の側、図では右）に巻く。ここで一度締めて、結び目を小さくしておく。','根拠：モノタロウ「2回目は1回目より下（荷台側）」、polalop「先程よりも右側に巻き付けます」。図は、巻き方が見えるように緩めて描いている'],
['垂れている端の側のロープを、二つ折りのまま、下側の輪に裏から通して、手前に引き出す。長い輪ができる。','根拠：モノタロウ、polalop の写真。モノタロウは通す前に「下側の輪を一度ねじる」と書いているが、polalop の写真ではねじっていないので、図はねじらずに描いている'],
['できた長い輪を、フックに引っ掛ける。フックには、二つ折りの2本がかかる。','根拠：モノタロウ、polalop の写真'],
['垂れている端（赤い点の側）を引く。下側の輪が滑車の代わりになり、少ない力で強く締まる。手前に引いてから下に引くとよく締まる。','根拠：モノタロウ（手前に引く→下に引く）、polalop（下方向に引いて引き締める）'],
['引いたまま、端をフックの軸に2回巻き付けて留める。','根拠：モノタロウ「二度フックに巻き付けてください。ロープを噛ませるように巻く」。図は2回巻いた形だけで、噛ませる（巻いた線どうしを押さえ合わせる）細かい形は描けていない。モノタロウはこの後、余りで輪を作ってフックに1〜2回掛け、端を隙間に押し込んで終わりにしている（図では省略）']
];
let step=6,hideTruck=false;
function setCap(t,s){document.getElementById('cap').innerHTML=t+'<div class="src">'+s+'</div>';}
function addRope(A,B){
// A＝荷物の側（オレンジ）、B＝端の側（青）。つなぎ目の点を共有する（重ねると縞模様が出る）。
dyn.add(tube(A,om));
const Bf=[A[A.length-1]].concat(B);
dyn.add(tube(Bf,bm));
dyn.add(endDot(Bf[Bf.length-1]));
window._pts=A.concat(B);
}
function build(){
window._curves=[];
while(dyn.children.length){const o=dyn.children[0];o.traverse(function(m){if(m.geometry)m.geometry.dispose();});dyn.remove(o);}
truck.visible=!hideTruck;
if(step===0){
const A=topPart().concat([P(SX,0.3),P(SX,-0.6)]);
dyn.add(tube(A,om));
const B=[A[A.length-2],A[A.length-1],P(SX,-1.6),P(SX,-2.6),P(SX,-3.4)];
dyn.add(tube(B,om));
dyn.add(endDot(B[B.length-1]));
window._pts=A.concat(B.slice(2));
return;
}
const turns=step===1?0.5:step===2?1.5:2.5;
const k=knot(turns);
let B=k.T0.slice();
if(step<=3){
B=B.concat([P(1.45,-0.7),P(1.45,-1.6),P(1.45,-2.6)]);
}else{
// 端の側は、下の輪の裏へ回り（leg1）、輪をくぐって手前に出る。
B=B.concat([P(1.45,-0.55,-0.1),P(1.25,-0.62,-0.3),P(0.8,-0.62,-0.32),P(0.5,-0.7,-0.2),P(0.45,-0.85,0),P(0.42,-1.0,0.25)]);
let back;
if(step===4){
// 二つ折りの先を右へ引き出した形（polalop の写真）。戻りの線は輪を手前から裏へくぐり、裏で下に垂れる。
B=B.concat([P(0.9,-1.25,0.32),P(1.6,-1.29,0.32)]);
for(let i=1;i<8;i++){const t=-Math.PI/2+i/8*Math.PI;B.push(P(1.9+0.17*Math.cos(t),-1.12+0.17*Math.sin(t),0.32));}
B=B.concat([P(1.6,-0.95,0.32),P(1.0,-0.95,0.32),P(0.8,-0.98,0.2),P(0.75,-1.05,0),P(0.8,-1.12,-0.25),P(0.95,-1.3,-0.4),P(1.1,-2.0,-0.45),P(1.15,-3.0,-0.45)]);
}else{
// 二つ折りの先をフックの軸の下に掛ける。5は掛けただけで2本がたるんでいる、6以降は張っている。
const sag=step===5?0.22:0;
B=B.concat([P(0.4-sag*0.5,-1.4,0.3),P(0.45-sag,-2.5,0.15),P(0.5-sag*0.5,-3.6,-0.05),P(0.5,-4.2,-0.18),P(0.5,-4.45,-0.2)]);
for(let i=0;i<=8;i++){const t=Math.PI+i/8*Math.PI;B.push(P(HX+0.165*Math.cos(t),HY+0.165*Math.sin(t),-0.2));}
B=B.concat([P(0.83,-4.45,-0.2),P(0.83,-4.2,-0.18),P(0.82+sag*0.5,-3.6,-0.05),P(0.85+sag,-2.5,0.15),P(0.82+sag*0.5,-1.4,0.3),P(0.8,-1.15,0.22),P(0.75,-1.05,0),P(0.8,-1.12,-0.25),P(0.95,-1.3,-0.42)]);
if(step===5)B=B.concat([P(1.15,-2.2,-0.5),P(1.2,-3.4,-0.5)]);
else if(step===6){B=B.concat([P(1.15,-2.4,-0.5),P(1.22,-4.2,-0.5),P(1.25,-5.6,-0.5),P(1.25,-6.3,-0.5)]);arrowDown(1.75,-4.6,-6.0,-0.5);}
else{
// フックの軸に2回巻く。巻いた線どうしは線1本分以上離す。
B=B.concat([P(1.1,-2.4,-0.5),P(1.02,-3.8,-0.46),P(0.85,-4.36,-0.45)]);
const t0=Math.PI*0.32;
for(let i=0;i<=40;i++){const t=t0-i/40*4*Math.PI;B.push(P(HX+0.175*Math.cos(t),HY+0.175*Math.sin(t),-0.45-0.44*i/40));}
// 巻き終わりは、巻いている向きのまま外へ離す（急に曲げるとフックに食い込んで見える）。
B=B.concat([P(HX+0.2*Math.cos(t0-0.45),HY+0.2*Math.sin(t0-0.45),-0.9),P(HX+0.3*Math.cos(t0-0.9),HY+0.3*Math.sin(t0-0.9),-0.9),P(1.15,-5.05,-0.9),P(1.25,-5.4,-0.9)]);
}
}
}
addRope(k.A,B);
}
const tgt=new V(0.3,-1,0),tgtG=new V(0.3,-1,0);
let th=0.35,ph=0.12,rad=12,radG=12,goT=null,goP=null,auto=false,drag=false,lx=0,ly=0;
function focusAll(){tgtG.set(0.2,-0.6,-0.8);radG=17;}
function focusKnot(){if(step<=3){tgtG.set(0.1,-0.5,0);radG=5.5;}else if(step===4){tgtG.set(0.6,-0.9,0);radG=6;}else if(step===7){tgtG.set(0.7,-4.4,-0.4);radG=4.5;}else{tgtG.set(0.6,-2.6,-0.2);radG=10;}}
function setStep(s,keep){
step=Math.max(0,Math.min(7,s));
setCap(CAP[step][0],CAP[step][1]);
build();
if(!keep){if(step===0)focusAll();else focusKnot();}
document.querySelectorAll('.vb[data-s]').forEach(function(b){b.classList.toggle('on',parseInt(b.dataset.s)===step);});
}
window._setStep=setStep;
function place(){
tgt.lerp(tgtG,0.15);
rad+=(radG-rad)*0.15;
cam.position.set(tgt.x+rad*Math.cos(ph)*Math.sin(th),tgt.y+rad*Math.sin(ph),tgt.z+rad*Math.cos(ph)*Math.cos(th));
cam.lookAt(tgt);
}
function zoom(f){radG=Math.max(1.5,Math.min(30,radG*f));}
const ptrs=new Map();
let pd=0;
c.addEventListener('pointerdown',function(e){
ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
c.setPointerCapture(e.pointerId);
goT=null;goP=null;
if(ptrs.size===1){drag=true;lx=e.clientX;ly=e.clientY;c.style.cursor='grabbing';}
if(ptrs.size===2){drag=false;const a=Array.from(ptrs.values());pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
});
function up2(e){
ptrs.delete(e.pointerId);
if(ptrs.size===0){drag=false;c.style.cursor='grab';}
if(ptrs.size===1){const a=Array.from(ptrs.values())[0];lx=a.x;ly=a.y;drag=true;}
}
c.addEventListener('pointerup',up2);
c.addEventListener('pointercancel',up2);
c.addEventListener('pointermove',function(e){
if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(ptrs.size===2){
const a=Array.from(ptrs.values());
const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
if(pd>0&&d>0){zoom(pd/d);}
pd=d;
return;
}
if(!drag)return;
th-=(e.clientX-lx)*0.012;
ph=Math.max(-1.5,Math.min(1.5,ph+(e.clientY-ly)*0.012));
lx=e.clientX;ly=e.clientY;
});
c.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY>0?1.12:0.89);},{passive:false});
document.querySelectorAll('.vb[data-s]').forEach(function(b){
b.addEventListener('click',function(){setStep(parseInt(b.dataset.s),false);});
});
document.getElementById('nx').addEventListener('click',function(){setStep(step>=7?0:step+1,false);});
document.getElementById('zi').addEventListener('click',function(){zoom(0.7);});
document.getElementById('zo').addEventListener('click',function(){zoom(1.4);});
document.getElementById('fs').addEventListener('click',focusKnot);
document.getElementById('fa').addEventListener('click',focusAll);
document.getElementById('hp').addEventListener('click',function(){
hideTruck=!hideTruck;
this.textContent=hideTruck?'荷台を出す':'荷台を隠す';
truck.visible=!hideTruck;
});
document.querySelectorAll('.vb[data-t]').forEach(function(b){
b.addEventListener('click',function(){
goT=parseFloat(b.dataset.t)*Math.PI/180;
goP=parseFloat(b.dataset.p);
auto=false;
document.getElementById('ar').textContent='自動回転 切';
});
});
document.getElementById('ar').addEventListener('click',function(){
auto=!auto;goT=null;goP=null;
this.textContent=auto?'自動回転 入':'自動回転 切';
});
window.addEventListener('resize',function(){const w=c.clientWidth||340;renderer.setSize(w,H);cam.aspect=w/H;cam.updateProjectionMatrix();});
function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}
function loop(){
requestAnimationFrame(loop);
if(auto&&!drag)th+=0.01;
if(goT!==null){
const d=wrap(goT-th);
th+=d*0.15;
ph+=(goP-ph)*0.15;
if(Math.abs(d)<0.005&&Math.abs(goP-ph)<0.005){th=goT;ph=goP;goT=null;goP=null;}
}
place();
renderer.render(scene,cam);
}
setStep(6,false);
loop();
</script>
</body>
</html>
